# Must match the Cloudflare Git-integrated Worker (repo name / dashboard
# project). `wrangler secret put` uses this name — a mismatch sends PROXY_KEY
# to a different Worker than Zeabur hits (YF_PROXY_BASE).
name = "cloudflare-proxy"
main = "src/index.js"
compatibility_date = "2025-08-01"

# Set PROXY_KEY as a Worker secret (required for proxy routes):
#   npx wrangler secret put PROXY_KEY
# Value must equal Zeabur YF_PROXY_KEY (no extra quotes / newline).
#
# DEBUG_AUTH=0 (default): off. Set to "1" temporarily to console.log both keys
# as raw + hex + spaced chars on 401/503 for Cloudflare dashboard comparison.
# Rotate PROXY_KEY if those logs were shared.
[vars]
DEBUG_AUTH = "0"
# ALLOWED_HOSTS = "query1.finance.yahoo.com,query2.finance.yahoo.com"

# Workers Logs / custom console.log persistence (off unless debugging).
[observability]
enabled = false
head_sampling_rate = 1
